[project]
name = "socrates"
version = "0.1.0"
description = "SOCrates - autonomous SOC investigation & response agent (Team Galaxy Flare, Tech Zephyr 4.0 Agentic AI Hackathon, PS9)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.setuptools]
packages = ["sandbox", "agent", "eval"]
