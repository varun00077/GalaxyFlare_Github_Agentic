services:
  sandbox:
    build: .
    command: uvicorn sandbox.app:app --host 0.0.0.0 --port 8001
    environment:
      - SCENARIO=s2
    ports:
      - "8001:8001"
  # The agent service + analyst UI at http://localhost:8000
  web:
    build: .
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - SANDBOX_URL=http://sandbox:8001
    ports:
      - "8000:8000"
    depends_on:
      - sandbox
  # One-shot CLI investigation against the sandbox service:
  #   docker compose run --rm agent
  agent:
    build: .
    command: python -m agent.cli run --scenario s2 --auto-approve --sandbox-url http://sandbox:8001
    env_file: .env
    depends_on:
      - sandbox
    profiles: ["cli"]
